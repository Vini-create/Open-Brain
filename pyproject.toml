[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-local"
version = "0.1.0"
description = "Local project memory for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["sentence-transformers>=3,<6", "PyYAML>=6", "sqlite-vec>=0.1.6,<0.2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1"]
benchmark = ["tiktoken>=0.8"]

[project.scripts]
brain = "second_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
second_brain = ["assets/*.html"]
