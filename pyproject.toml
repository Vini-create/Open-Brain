[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-local"
version = "0.1.0"
description = "Local project memory for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["sentence-transformers>=3,<6", "PyYAML>=6", "sqlite-vec>=0.1.6,<0.2"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4"]
test = ["pytest>=8", "httpx>=0.27,<1"]
benchmark = ["tiktoken>=0.8"]

[project.scripts]
brain = "second_brain.cli:main"
brain-server = "brain_engine.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
second_brain = ["assets/*.html"]
brain_engine = ["*.json", "*.html"]
