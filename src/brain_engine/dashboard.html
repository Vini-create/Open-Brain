<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Engine</title>
<style>
:root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e2dc; --accent:#3b5bdb; --ok:#2b8a3e; --warn:#c77700; }
@media (prefers-color-scheme: dark) { :root { --bg:#141413; --panel:#1d1d1b; --ink:#ecebe6; --muted:#9b9a94; --line:#33322e; --accent:#7d95f0; --ok:#69c27d; --warn:#f0a840; } }
* { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
header h1 { font-size:16px; margin:0; } header .stat { color:var(--muted); font-size:12px; }
main { display:grid; grid-template-columns:260px 1fr; min-height:calc(100vh - 54px); }
aside { border-right:1px solid var(--line); padding:12px; } aside button { display:block; width:100%; text-align:left; padding:8px 10px; margin-bottom:4px; border:1px solid transparent; border-radius:8px; background:none; color:var(--ink); cursor:pointer; }
aside button.active, aside button:hover { background:var(--panel); border-color:var(--line); }
aside small { color:var(--muted); display:block; }
section { padding:16px 20px; overflow:auto; } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
.card h3 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
.row { padding:6px 0; border-bottom:1px solid var(--line); } .row:last-child { border:0; }
.pill { font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid var(--line); color:var(--muted); margin-left:6px; }
.pill.implemented, .pill.accepted, .pill.fixed, .pill.chosen { color:var(--ok); border-color:var(--ok); }
.pill.in_progress, .pill.open, .pill.blocked { color:var(--warn); border-color:var(--warn); }
pre { white-space:pre-wrap; font:12px/1.4 ui-monospace, monospace; margin:0; }
input { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); }
.muted { color:var(--muted); }
@media (max-width:720px) { main { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } section { padding:16px; } }
</style>
</head>
<body>
<header><h1>Brain Engine</h1><span class="stat" id="stat">carregando…</span></header>
<main>
  <aside><div id="projects"></div><h3 class="muted" style="font-size:12px;margin:16px 4px 6px">Knowledge</h3><div id="collections" class="muted"></div></aside>
  <section>
    <div class="card" style="margin-bottom:14px"><h3>Buscar</h3><input id="q" placeholder="ex.: memória de longo prazo para agentes (Enter)"><pre id="results" style="margin-top:10px"></pre></div>
    <div class="grid" id="detail"><div class="card muted">Selecione um projeto.</div></div>
  </section>
</main>
<script>
let current = null;
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const get = async (url, opts) => { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); };
async function load() {
  const s = await get("/healthz");
  document.getElementById("stat").textContent = `${s.projects} projetos · ${s.records} registros · ${s.kb_chunks} trechos de conhecimento · ${s.llm_calls} chamadas LLM`;
  const projects = await get("/v1/projects");
  document.getElementById("projects").innerHTML = projects.map(p => `<button data-id="${p.id}" class="${p.id===current?"active":""}">${esc(p.name)}<small>${p.records} registros · ${esc(p.slug)}</small></button>`).join("") || '<p class="muted">Nenhum projeto.</p>';
  document.querySelectorAll("#projects button").forEach(b => b.onclick = () => { current = b.dataset.id; load(); });
  const cols = await get("/v1/knowledge/collections");
  document.getElementById("collections").innerHTML = cols.map(c => `<div class="row">${esc(c.title)}<small>${c.documents} docs · ${c.chunks} trechos ${c.ingest?.state === "running" ? `· ingerindo ${c.ingest.documents_done||0}/${c.ingest.documents_total||"?"}` : ""}</small></div>`).join("") || "Sem coleções.";
  if (current) detail(current);
}
async function detail(id) {
  const [summary, records, events, cost] = await Promise.all([get(`/v1/projects/${id}`), get(`/v1/projects/${id}/records?limit=300`), get(`/v1/projects/${id}/events?limit=25`), get(`/v1/telemetry/report?project=${id}`)]);
  const groups = {};
  records.forEach(r => (groups[r.kind] ||= []).push(r));
  const order = ["objective","idea","architecture","component","decision","feature","bug","constraint","requirement","risk","alternative","next_step","implementation","learning","spec"];
  const kinds = [...order.filter(k => groups[k]), ...Object.keys(groups).filter(k => !order.includes(k))];
  document.getElementById("detail").innerHTML =
    `<div class="card"><h3>${esc(summary.project.name)}</h3><p>${esc(summary.project.description)||'<span class="muted">sem descrição</span>'}</p><p class="muted">${summary.records} registros ativos</p></div>` +
    kinds.map(k => `<div class="card"><h3>${k} (${groups[k].length})</h3>${groups[k].slice(0,12).map(r => `<div class="row">${esc(r.title)}<span class="pill ${r.status}">${r.status}</span><br><small class="muted">${esc(r.key)} · ${esc(r.source)}</small></div>`).join("")}</div>`).join("") +
    `<div class="card"><h3>Histórico</h3>${events.map(e => `<div class="row"><small class="muted">${e.created_at.slice(0,16).replace("T"," ")} · ${esc(e.type)} · ${esc(e.actor)}</small><br>${esc(e.summary)}</div>`).join("") || '<span class="muted">vazio</span>'}</div>` +
    `<div class="card"><h3>Custo de LLM</h3><pre>${esc(cost.table)}</pre></div>`;
}
document.getElementById("q").addEventListener("keydown", async e => {
  if (e.key !== "Enter") return;
  const body = { query: e.target.value, scope: current ? "all" : "knowledge", project: current, limit: 6, token_budget: 900 };
  const out = document.getElementById("results");
  out.textContent = "buscando…";
  try { const r = await get("/v1/search", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); out.textContent = r.context + `\n\n(${r.duration_ms} ms · ~${r.estimated_tokens} tokens · intenção: ${r.intent.domains.map(d => d.id).join(", ") || "—"})`; }
  catch (err) { out.textContent = String(err); }
});
load(); setInterval(load, 15000);
</script>
</body>
</html>
